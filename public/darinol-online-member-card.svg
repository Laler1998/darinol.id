<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500" role="img" aria-labelledby="title desc">
  <title id="title">Darinol.online Trend Radar Pro Member card</title>
  <desc id="desc">Premium dark glassmorphism member card with Darinol orange and magenta glow.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909"/>
      <stop offset="0.55" stop-color="#0d0d0e"/>
      <stop offset="1" stop-color="#121012"/>
    </linearGradient>
    <radialGradient id="orangeOrb" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#ff7a45" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaOrb" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#9b174d" stop-opacity="0.7"/>
      <stop offset="0.48" stop-color="#6a123d" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3c0c2d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.17"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="orangeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff7a45" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </linearGradient>
    <filter id="orbBlur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="105"/>
    </filter>
    <filter id="cardBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
      <feColorMatrix in="blur" type="saturate" values="1.35"/>
    </filter>
    <filter id="shadow" x="-25%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="42" stdDeviation="48" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="410" y="285" width="1180" height="850" rx="72"/>
    </clipPath>
  </defs>

  <rect width="2000" height="1500" fill="url(#stage)"/>

  <!-- Soft brand glow: kept behind the card so the glass carries the color. -->
  <ellipse cx="1370" cy="710" rx="650" ry="510" fill="url(#orangeOrb)" filter="url(#orbBlur)"/>
  <ellipse cx="1330" cy="1120" rx="610" ry="420" fill="url(#magentaOrb)" filter="url(#orbBlur)"/>
  <ellipse cx="1450" cy="560" rx="260" ry="235" fill="#ff7a45" opacity="0.16" filter="url(#orbBlur)"/>

  <!-- Framed member card, sized at a credit-card-like 1.39 ratio. -->
  <g filter="url(#shadow)">
    <rect x="410" y="285" width="1180" height="850" rx="72" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="3"/>
    <rect x="414" y="289" width="1172" height="842" rx="68" fill="none" stroke="#ffffff" stroke-opacity="0.075" stroke-width="2"/>
  </g>

  <!-- Frosted color wash inside the glass surface. -->
  <g clip-path="url(#cardClip)" opacity="0.55" filter="url(#cardBlur)">
    <ellipse cx="1270" cy="620" rx="480" ry="290" fill="#ff7a45" opacity="0.22"/>
    <ellipse cx="1270" cy="1070" rx="520" ry="310" fill="#8d174b" opacity="0.18"/>
  </g>

  <!-- Restrained inner highlight and brand accent. -->
  <path d="M482 451C625 345 850 321 1065 326" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
  <path d="M570 1039H1430" stroke="url(#orangeLine)" stroke-width="3" stroke-linecap="round"/>

  <!-- Brand mark. -->
  <g transform="translate(520 405)">
    <rect width="76" height="76" rx="20" fill="#ff7a45"/>
    <path d="M24 55V21h10v24h18c8 0 12-3 12-9s-4-9-12-9H42v-6h12c16 0 24 5 24 15s-8 19-25 19H24Z" fill="#1b0b05"/>
  </g>
  <text x="622" y="456" fill="#ffffff" font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif" font-size="45" font-weight="600" letter-spacing="1">Darinol<tspan fill="#ff9a73">.online</tspan></text>

  <text x="520" y="590" fill="#ffffff" fill-opacity="0.62" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="5">TREND INTELLIGENCE NETWORK</text>
  <text x="520" y="820" fill="#ffffff" font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="500" letter-spacing="10">••••  ••••  ••••  2026</text>

  <g transform="translate(520 950)">
    <text y="0" fill="#ffffff" fill-opacity="0.55" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3">MEMBER</text>
    <text y="48" fill="#ffffff" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600">Trend Radar</text>
  </g>
  <g transform="translate(1350 936)">
    <rect width="166" height="58" rx="29" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
    <text x="83" y="37" text-anchor="middle" fill="#ffffff" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">PRO MEMBER</text>
  </g>

  <!-- A single light grain layer across the complete composition. -->
  <rect width="2000" height="1500" filter="url(#grain)" opacity="0.085" style="mix-blend-mode:overlay" pointer-events="none"/>
</svg>
